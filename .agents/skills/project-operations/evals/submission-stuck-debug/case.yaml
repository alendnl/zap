schema_version: "1.1"
name: submission-stuck-debug
expected_outcome: |
  The agent runs zap-ops doctor, then inspects the submission record from MongoDB (via zap-ops mongo get --env prod -c submissions <ID>), then checks Cloud Tasks queue state, then queries executor logs for the submission ID. It correlates findings across systems and provides a diagnosis of the root cause or current state, following Playbook 1.
