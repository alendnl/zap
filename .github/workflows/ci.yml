name: ZAP CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.issues/**'
      - '**/*.md'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.issues/**'
      - '**/*.md'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to test and deploy (auto, all, backend, frontend)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
      frontend: ${{ steps.set-outputs.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            backend:
              - 'ZAP-BE/**'
              - 'pytest.ini'
              - '.github/workflows/**'
              - '.env*'
            frontend:
              - 'ZAP-FE/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.env*'

      - name: Resolve target components
        id: set-outputs
        run: |
          TARGET="${{ inputs.target || 'auto' }}"
          FILTER_BE="${{ steps.filter.outputs.backend }}"
          FILTER_FE="${{ steps.filter.outputs.frontend }}"

          if [ "$TARGET" = "all" ]; then
            BE="true"
            FE="true"
          elif [ "$TARGET" = "backend" ]; then
            BE="true"
            FE="false"
          elif [ "$TARGET" = "frontend" ]; then
            BE="false"
            FE="true"
          else
            # 'auto' mode
            if [ "$FILTER_BE" = "true" ] || [ "$FILTER_FE" = "true" ]; then
              BE="$FILTER_BE"
              FE="$FILTER_FE"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BE="true"
              FE="true"
            else
              BE="$FILTER_BE"
              FE="$FILTER_FE"
            fi
          fi

          echo "backend=$BE" >> "$GITHUB_OUTPUT"
          echo "frontend=$FE" >> "$GITHUB_OUTPUT"
          echo "Change Detection -> Backend: $BE | Frontend: $FE (Mode: $TARGET, Event: ${{ github.event_name }})"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ZAP-BE/requirements.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install backend dependencies
        run: pip install --prefer-binary -r ZAP-BE/requirements.txt
      - name: Run backend tests
        working-directory: ZAP-BE
        run: python -m pytest -v

  frontend-tests:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ZAP-FE/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('ZAP-FE/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Build frontend
        run: npm run build --workspace=ZAP-FE
        env:
          NEXT_PUBLIC_API_URL: https://zap-api-394729648143.us-central1.run.app
      - name: Run frontend tests
        run: npm test --workspace=ZAP-FE

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-tests, frontend-tests]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.backend-tests.result == 'success' &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      PROJECT_ID: zap-platform-prod
      REGION: us-central1
      PROJECT_NUMBER: "394729648143"
      AR_REPOSITORY: zap-images
      API_SERVICE: zap-api
      EXECUTOR_SERVICE: zap-executor
      MONGODB_SECRET: zap-mongodb-uri
      API_RUNTIME_SA: zap-api-runtime@zap-platform-prod.iam.gserviceaccount.com
      EXECUTOR_RUNTIME_SA: zap-executor-runtime@zap-platform-prod.iam.gserviceaccount.com
      TASK_CALLER_SA: zap-tasks-invoker@zap-platform-prod.iam.gserviceaccount.com
      DEPLOYER_SA: zap-github-deployer@zap-platform-prod.iam.gserviceaccount.com
      IMAGE_TAG: ${{ github.sha }}
      EXECUTOR_URL: https://zap-executor-394729648143.us-central1.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/394729648143/locations/global/workloadIdentityPools/github-actions/providers/zap-repository
          service_account: zap-github-deployer@zap-platform-prod.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure deployment permissions in parallel
        run: |
          set -euo pipefail
          echo "Configuring service accounts and queues in parallel..."
          for runtime in "$API_RUNTIME_SA" "$EXECUTOR_RUNTIME_SA"; do
            gcloud iam service-accounts add-iam-policy-binding "$runtime" \
              --project="$PROJECT_ID" \
              --member="serviceAccount:${DEPLOYER_SA}" \
              --role=roles/iam.serviceAccountUser --quiet &
          done
          gcloud iam service-accounts add-iam-policy-binding "$TASK_CALLER_SA" \
            --project="$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role=roles/iam.serviceAccountUser --quiet &
          gcloud iam service-accounts add-iam-policy-binding "$TASK_CALLER_SA" \
            --project="$PROJECT_ID" \
            --member="serviceAccount:${API_RUNTIME_SA}" \
            --role=roles/iam.serviceAccountUser --quiet &
          gcloud iam service-accounts add-iam-policy-binding "$TASK_CALLER_SA" \
            --project="$PROJECT_ID" \
            --member="serviceAccount:${TASK_CALLER_SA}" \
            --role=roles/iam.serviceAccountTokenCreator --quiet &
          for queue in zap-submissions zap-submissions-lower; do
            gcloud tasks queues add-iam-policy-binding "$queue" \
              --project="$PROJECT_ID" --location="$REGION" \
              --member="serviceAccount:${API_RUNTIME_SA}" \
              --role=roles/cloudtasks.enqueuer --quiet &
          done
          wait

      - name: Build and push images in parallel
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/zap-be-api:${IMAGE_TAG}"
          EXECUTOR_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/zap-be-executor:${IMAGE_TAG}"

          echo "Building API and Executor container images in parallel with Buildx layer caching..."
          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=gha,scope=zap-be-api \
            --cache-to=type=gha,mode=min,scope=zap-be-api \
            -t "$API_IMAGE" \
            -f ZAP-BE/Dockerfile.api \
            --push \
            ZAP-BE/ &
          PID_API=$!

          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=gha,scope=zap-be-executor \
            --cache-to=type=gha,mode=min,scope=zap-be-executor \
            -t "$EXECUTOR_IMAGE" \
            -f ZAP-BE/Dockerfile.executor-api \
            --push \
            ZAP-BE/ &
          PID_EXEC=$!

          wait "$PID_API"
          echo "API image built and pushed successfully."

          wait "$PID_EXEC"
          echo "Executor image built and pushed successfully."

      - name: Deploy services in parallel
        run: |
          set -euo pipefail
          echo "Deploying executor and API Cloud Run services in parallel..."

          gcloud run deploy "$EXECUTOR_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/zap-be-executor:${IMAGE_TAG}" \
            --no-allow-unauthenticated --service-account="$EXECUTOR_RUNTIME_SA" \
            --min=0 --max=5 --cpu=4 --memory=4Gi --concurrency=1 --timeout=360 \
            --update-secrets="MONGODB_URI=${MONGODB_SECRET}:latest" \
            --update-env-vars="ENVIRONMENT=production,DEBUG=false,GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=${REGION},EXECUTOR_TASK_URL=${EXECUTOR_URL}/internal/tasks/execute,TASKS_OIDC_AUDIENCE=${EXECUTOR_URL},TASKS_SERVICE_ACCOUNT=${TASK_CALLER_SA},DEFAULT_ENVIRONMENT=production,QA_DATABASE_NAME=zap_platform_lower,QA_QUEUE_NAME=zap-submissions-lower,PRODUCTION_DATABASE_NAME=zap_platform_prod,PRODUCTION_QUEUE_NAME=zap-submissions" \
            --quiet &
          PID_EXEC=$!

          gcloud run deploy "$API_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/zap-be-api:${IMAGE_TAG}" \
            --allow-unauthenticated --service-account="$API_RUNTIME_SA" \
            --min=0 --max=20 --cpu=1 --memory=512Mi --concurrency=80 \
            --update-secrets="MONGODB_URI=${MONGODB_SECRET}:latest" \
            --update-env-vars='^~^ENVIRONMENT=production~DEBUG=false~GCP_PROJECT_ID=zap-platform-prod~GCP_LOCATION=us-central1~EXECUTOR_TASK_URL=https://zap-executor-394729648143.us-central1.run.app/internal/tasks/execute~TASKS_OIDC_AUDIENCE=https://zap-executor-394729648143.us-central1.run.app~TASKS_SERVICE_ACCOUNT=zap-tasks-invoker@zap-platform-prod.iam.gserviceaccount.com~DEFAULT_ENVIRONMENT=production~QA_DATABASE_NAME=zap_platform_lower~QA_QUEUE_NAME=zap-submissions-lower~PRODUCTION_DATABASE_NAME=zap_platform_prod~PRODUCTION_QUEUE_NAME=zap-submissions~CORS_ORIGINS=["http://localhost:3000","https://codezap-arena.vercel.app","https://www.codezap-arena.vercel.app","https://run.codezap.in","https://codezap.in","https://www.codezap.in"]~CORS_ORIGIN_REGEX=https://([a-z0-9-]+[.])?codezap[.]in|https://codezap-arena-[a-z0-9-]+-alendnl[.]vercel[.]app' \
            --quiet &
          PID_API=$!

          wait "$PID_EXEC"
          echo "Executor deployed successfully. Granting task invoker permission..."
          gcloud run services add-iam-policy-binding "$EXECUTOR_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member="serviceAccount:${TASK_CALLER_SA}" \
            --role=roles/run.invoker --quiet &
          PID_BIND=$!

          wait "$PID_API"
          echo "API deployed successfully."

          wait "$PID_BIND"
          echo "Task caller invoker binding confirmed."

      - name: Verify deployment
        run: |
          set -euo pipefail
          API_URL="$(gcloud run services describe "$API_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$API_URL/health" | tee /tmp/health.json
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["status"] == "healthy", d'
          PREFLIGHT_STATUS="$(curl --silent --output /tmp/cors-preflight.txt --write-out '%{http_code}' -X OPTIONS "$API_URL/api/v1/submissions" -H 'Origin: https://codezap-arena.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,x-zap-env')"
          test "$PREFLIGHT_STATUS" = "200" || { cat /tmp/cors-preflight.txt; exit 1; }
          for queue in zap-submissions zap-submissions-lower; do
            echo "Checking Cloud Tasks queue: $queue"
            gcloud tasks queues describe "$queue" --project="$PROJECT_ID" --location="$REGION" --format='value(name)' &
          done
          gcloud run services describe "$EXECUTOR_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json > /tmp/executor-service.json &
          wait
          python -c 'import json,sys; d=json.load(open("/tmp/executor-service.json")); conditions=d.get("status",{}).get("conditions",[]); ready=next((c.get("status") for c in conditions if c.get("type")=="Ready"),None); print("Executor Ready condition:", ready); print("Conditions:", conditions); sys.exit(0 if ready=="True" else 1)'
