name: ZAP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ZAP-BE/requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build --workspace=ZAP-FE
        env:
          NEXT_PUBLIC_API_URL: https://zap-api-394729648143.us-central1.run.app

      - name: Run Frontend Tests
        run: npm test --workspace=ZAP-FE

  deploy-api:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: zap-platform-prod
      GCP_WIF_PROVIDER: projects/394729648143/locations/global/workloadIdentityPools/github-actions/providers/zap-repository
      GCP_DEPLOY_SERVICE_ACCOUNT: zap-github-deployer@zap-platform-prod.iam.gserviceaccount.com
      GCP_REGION: us-central1
      AR_REPOSITORY: zap-images
      SERVICE_NAME: zap-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/zap-be-api:${IMAGE_TAG}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 \
            -t "$IMAGE" \
            -f ZAP-BE/Dockerfile.api \
            ZAP-BE/
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --quiet

      - name: Verify production health endpoint
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 \
            "$SERVICE_URL/health" | tee /tmp/health.json
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["status"] == "healthy" and d["environment"] == "production", d'
